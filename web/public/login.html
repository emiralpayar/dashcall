<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashcall</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css">
</head><body class="login-body">
<div class="lang lang-float" role="group" data-i18n-aria-label="lang.label"><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button></div>
<form id="f" class="login">
  <img src="/icon.svg" alt="" width="64" height="64">
  <h1>Dashcall</h1>
  <input id="pw" type="password" data-i18n-placeholder="login.password" autocomplete="current-password" autofocus>
  <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" data-i18n-placeholder="login.code" hidden>
  <button class="btn primary big" data-i18n="login.submit">Log in</button>
  <p id="err" class="err"></p>
</form>
<script src="/i18n.js"></script>
<script src="/login.js"></script>
</body></html>
